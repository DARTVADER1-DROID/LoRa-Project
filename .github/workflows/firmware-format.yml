name: Firmware formatting

on:
  pull_request:
    paths:
      - "firmware/campus_assistance/**"
      - ".clang-format"
      - ".github/workflows/firmware-format.yml"
  push:
    branches: [main, feature/campus-assistance-firmware-skeleton]
    paths:
      - "firmware/campus_assistance/**"
      - ".clang-format"

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Verify formatting
        run: bash firmware/campus_assistance/scripts/check-format.sh
      - name: Configure host contract build
        run: cmake -S firmware/campus_assistance -B build/campus-assistance
      - name: Compile public C++11 contracts
        run: cmake --build build/campus-assistance --parallel
      - name: Run contract smoke test
        run: ctest --test-dir build/campus-assistance --output-on-failure
