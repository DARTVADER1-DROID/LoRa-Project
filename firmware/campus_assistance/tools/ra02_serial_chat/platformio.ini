[platformio]
default_envs = uno, esp32dev
src_dir = src

[env]
framework = arduino
lib_deps =
  sandeepmistry/LoRa @ ^0.8.0
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno
build_src_filter = +<uno/uno.ino>

[env:esp32dev]
platform = espressif32
board = esp32dev
build_src_filter = +<esp32dev/esp32dev.ino>
