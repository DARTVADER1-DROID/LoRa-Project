[platformio]
default_envs = uno, esp32devkitv1, wroom32
src_dir = src

[env]
framework = arduino
lib_deps =
  sandeepmistry/LoRa @ ^0.8.0
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno
build_src_filter = +<uno/uno.ino>

; ESP32-WROOM-32 module on a suitable carrier/USB-UART adapter.
; Arduino IDE board selection: ESP32 Dev Module.
[env:wroom32]
platform = espressif32
board = esp32dev
build_src_filter = +<wroom32/wroom32.ino>

; DOIT ESP32 DevKit V1 (commonly fitted with ESP32-WROOM-32).
; Arduino IDE board selection: DOIT ESP32 DEVKIT V1.
[env:esp32devkitv1]
platform = espressif32
board = esp32dev
build_src_filter = +<esp32devkitv1/esp32devkitv1.ino>

; Backward-compatible alias for the original ESP32 DevKit V1 sketch.
[env:esp32dev]
platform = espressif32
board = esp32dev
build_src_filter = +<esp32dev/esp32dev.ino>
