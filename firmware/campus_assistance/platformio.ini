[platformio]
src_dir = .

[env]
framework = arduino
build_flags =
  -std=gnu++11
  -Ishared/include
  -Iplatform/include
lib_ldf_mode = chain+

[env:uno_station]
platform = atmelavr
board = uno
build_src_filter =
  +<shared/src/*.cpp>
  +<shared/src/**/*.cpp>
  +<targets/arduino/uno_station.cpp>

[env:uno_cart]
platform = atmelavr
board = uno
build_src_filter =
  +<shared/src/*.cpp>
  +<shared/src/**/*.cpp>
  +<targets/arduino/uno_cart.cpp>

[env:esp32_station]
platform = espressif32@6.12.0
board = esp32dev
build_src_filter =
  +<shared/src/*.cpp>
  +<shared/src/**/*.cpp>
  +<targets/arduino/esp32_station.cpp>

[env:esp32_cart]
platform = espressif32@6.12.0
board = esp32dev
build_src_filter =
  +<shared/src/*.cpp>
  +<shared/src/**/*.cpp>
  +<targets/arduino/esp32_cart.cpp>
